{% extends "base.html" %}

{% block title %}
Tickets - IT Automation POC
{% endblock %}

{% block content %}

<h2>AI Ticket Triage</h2>

<div class="card">

    <h3>Create Ticket</h3>

    <form id="ticket-form">

        <label for="employee-id">Employee ID</label>
        <input
            type="number"
            id="employee-id"
            required
        >

        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            required
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            rows="5"
            required
        ></textarea>

        <button type="submit">
            Create & Analyze Ticket
        </button>

    </form>

</div>


<div class="card" id="ticket-result" style="display: none;">

    <h3>AI Triage Result</h3>

    <p>
        <strong>Ticket:</strong>
        <span id="result-ticket-number"></span>
    </p>

    <p>
        <strong>Category:</strong>
        <span id="result-category"></span>
    </p>

    <p>
        <strong>Priority:</strong>
        <span id="result-priority"></span>
    </p>

    <p>
        <strong>Assigned Team:</strong>
        <span id="result-team"></span>
    </p>

    <p>
        <strong>AI Summary:</strong>
        <span id="result-summary"></span>
    </p>

    <p>
        <strong>Recommendations:</strong>
    </p>

    <ul id="result-recommendations"></ul>

</div>

{% endblock %}


{% block scripts %}
<script src="{{ url_for('static', filename='js/tickets.js') }}"></script>
{% endblock %}
