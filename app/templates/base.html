<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}IT Automation POC{% endblock %}</title>

    <!-- Shared styles used by every page -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

    <!-- Page-specific styles -->
    {% block styles %}
    {% endblock %}
</head>

<body>

    <header class="topbar">
        <h1>IT Automation POC</h1>
    </header>

    <div class="layout">

        <nav class="sidebar">
            <a href="/">Dashboard</a>
            <a href="/tickets-ui">Tickets</a>
            <a href="/assets-ui">Assets</a>
            <a href="/onboarding-ui">Onboarding</a>
            <a href="/employees-ui">Employees</a>
        </nav>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>

    </div>

    {% block scripts %}
    {% endblock %}

</body>
</html>
